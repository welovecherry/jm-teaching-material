site_name: 강사 예습 튜토리얼 · SKT K-뉴딜 보안 부트캠프
site_description: 정민홍 강사 본인 예습용 — 강의 전에 먼저 공부하는 아주 자세한 튜토리얼
docs_dir: docs

theme:
  name: material
  language: ko
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 다크 모드로 전환
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 라이트 모드로 전환
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - search.highlight
    - search.suggest

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - abbr                       # 약어에 마우스 올리면 뜻 툴팁 (*[OSI]: ... 정의)
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid        # ```mermaid 코드블록을 다이어그램으로 렌더
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      use_pygments: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.keys
  - pymdownx.mark              # ==형광펜== 강조
  - pymdownx.caret             # ^^밑줄/삽입^^ , 위첨자
  - pymdownx.tilde             # ~~취소선~~ , 아래첨자
  - pymdownx.emoji
  - toc:
      permalink: true
      toc_depth: 3

plugins:
  - search

